<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      h1 span { color: #c8102e; }
      p { margin: 6px 0; }
      .muted { opacity: 0.65; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border-radius: 6px; border: 1px solid #8884; letter-spacing: 2px; text-transform: uppercase; }
      button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid #8884; background: transparent; cursor: pointer; margin-top: 8px; }
      button.primary { background: #c8102e; color: #fff; border-color: #c8102e; }
      button:disabled { opacity: 0.5; }
      button.link { border: none; padding: 0; margin: 0; opacity: 0.65; text-decoration: underline; }
      .status { padding: 8px 10px; border-radius: 6px; margin: 8px 0; }
      .ok { background: #1f7a4d22; }
      .warn { background: #9a670022; }
      .err { background: #b4231822; }
      .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
      details { margin-top: 12px; }
      summary { cursor: pointer; opacity: 0.65; }
      details input { letter-spacing: 0; text-transform: none; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1><span>cally</span> for SFU Canvas</h1>
    <div id="app"><p class="muted">Loading…</p></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
