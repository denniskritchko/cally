# fly launch --no-deploy, then: fly secrets set DATABASE_URL=... ENCRYPTION_KEY=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
app = "cally"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  APP_URL = "https://cally.fly.dev"
  CANVAS_BASE_URL = "https://canvas.sfu.ca"
  DEFAULT_TIMEZONE = "America/Vancouver"
  SYNC_CRON = "*/15 * * * *"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # the sync scheduler lives in this process; keep it running
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
