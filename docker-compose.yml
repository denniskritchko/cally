# Local Postgres for anyone without one installed: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cally
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
